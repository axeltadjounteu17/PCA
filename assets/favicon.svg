<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PCA Prep">
  <!-- Fond : violet d'étude du design system -->
  <rect width="64" height="64" rx="14" fill="#7C3AED"/>
  <!-- Hexagone : les six piliers du Well-Architected Framework.
       Tracé épais pour rester lisible à 16 px. -->
  <path d="M32 13 L48 22.5 L48 41.5 L32 51 L16 41.5 L16 22.5 Z"
        fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linejoin="round"/>
  <!-- Noyau : la décision au centre des contraintes -->
  <circle cx="32" cy="32" r="6.5" fill="#FFFFFF"/>
</svg>
